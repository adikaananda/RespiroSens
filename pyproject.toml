[project]
name = "respirosens"
version = "0.1.0"
description = "RespiroSens Flask Backend"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Cors==4.0.1",
    "itsdangerous==2.2.0",
    "Werkzeug==3.0.4",
    "python-dotenv==1.0.1",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "xgboost==2.1.1",
    "shap==0.46.0",
    "reportlab==4.2.2",
    "qrcode==7.4.2",
    "Pillow==10.4.0",
    "opencv-python-headless==4.10.0.84",
    "pytesseract==0.3.13",
    "requests==2.32.3",
    "PyMySQL==1.1.1",
    "cryptography==43.0.1",
    "pytest==8.3.2"
]

[tool.vercel]
entrypoint = "run:app"
