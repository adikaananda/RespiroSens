[project]
name = "respirosens"
version = "0.1.0"
description = "RespiroSens Flask Backend"
requires-python = ">=3.12,<3.15"

dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Cors==4.0.1",
    "itsdangerous==2.2.0",
    "Werkzeug==3.0.4",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "numpy>=1.26,<3",
    "xgboost-cpu>=2.1.1,<3",
    "reportlab>=4.2.2",
    "qrcode>=7.4.2",
    "Pillow>=10.4.0",
    "PyMySQL==1.1.1",
    "cryptography>=43.0.1"
]

[tool.vercel]
entrypoint = "run:app"