     round caps/joins) so every icon reads at 18-24px in the sidebar,
     topbar and cards. IDs kept identical so no other file needs to change. -->

<defs>

<g id="ic-users"><circle cx="9" cy="7.5" r="3.3"/><path d="M2.5 20c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/><circle cx="17.2" cy="8.3" r="2.6"/><path d="M15.8 13.9c2.9.5 5 3 5 6.1"/></g>

    stroke-linejoin="round"/>

<g id="ic-chat"><path d="M21 11.2a8.3 8.3 0 01-8.3 8.3 8.3 8.3 0 01-3.7-.87L3 20.5l1.87-6a8.3 8.3 0 01-.87-3.7A8.3 8.3 0 0112.3 2.5a8.3 8.3 0 018.7 8.7z"/></g>

<g id="ic-eye"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7-10.5-7-10.5-7z"/><circle cx="12" cy="12" r="3.2"/></g>

<g id="ic-cough"><circle cx="12" cy="7.3" r="3.8"/><path d="M4 21c0-4.2 3.6-7.4 8-7.4s8 3.2 8 7.4"/><path d="M16 15.5c1.2.5 2.2 1.3 2.9 2.3M18.3 12.2c.9.2 1.7.7 2.3 1.4" stroke-linecap="round"/></g>

<g id="ic-mic"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 10.5a6.5 6.5 0 0013 0" stroke-linecap="round"/><path d="M12 18.5v3" stroke-linecap="round"/></g>

<g id="ic-send"><path d="M21.5 2.5L11 13" stroke-linecap="round" stroke-linejoin="round"/><path d="M21.5 2.5l-6.7 19-4-8.8-8.8-4z" stroke-linejoin="round"/></g>

<g id="ic-video"><rect x="2" y="6.5" width="14" height="11" rx="2"/><path d="M16 10.3l5.5-3.5v10.4l-5.5-3.5z" stroke-linejoin="round"/></g>

<g id="ic-mail"><rect x="2" y="4.5" width="20" height="15" rx="2"/><path d="M3 6.5l9 6 9-6" stroke-linecap="round" stroke-linejoin="round"/></g>

<g id="ic-alert"><path d="M12 2.5L1.5 21.5h21z" stroke-linejoin="round"/><path d="M12 9.3v5" stroke-linecap="round"/><circle cx="12" cy="17.7" r="0.9" fill="currentColor" stroke="none"/></g>

<g id="ic-shield"><path d="M12 2.5l7.5 2.7v5.6c0 4.7-3.2 8-7.5 9.3-4.3-1.3-7.5-4.6-7.5-9.3V5.2z" stroke-linejoin="round"/><path d="M8.7 12.1l2.3 2.3 4.3-4.8" stroke-linecap="round" stroke-linejoin="round"/></g>

<g id="ic-map"><path d="M9 3.5L3 6v14.5l6-2.5 6 2.5 6-2.5V3l-6 2.5-6-2z" stroke-linejoin="round"/><path d="M9 3.5v14.5M15 5.5V20"/></g>

</defs>
</svg>

<!-- ===================================================================
     This file is intentionally just a SHELL: the icon sprite, the login
     mount point, and the app chrome (sidebar/topbar/content mount). Every
     actual screen lives in its own file under pages/ and is fetched into
     #loginScreen / #pageContent at runtime by js/nav.js — see frontend/README.md.
     =================================================================== -->

<!-- Login screen markup is fetched from pages/login.html by js/app.js -->
<div id="loginScreen"></div>

<!-- ===================== APP SHELL ===================== -->
<div id="appShell" class="hidden">
  <div class="sidebar">
    <div style="width: 55px; height: 55px;"  class="sb-logo"><img style="width: 60px;" src="assets/images/nt-logo.png" alt=""></div>
    <div class="sb-nav" id="sbNav"></div>
    <button class="sb-item sb-logout" onclick="doLogout()" title="Keluar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#ic-logout"/></svg>
    </button>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#ic-search"/></svg>
        <input type="text" id="topSearchInput" placeholder="Cari pasien" oninput="handleTopSearch()" style="border:none;outline:none;background:transparent;font:inherit;width:100%;color:inherit;">
      </div>
      <div class="top-actions">
        <div class="role-badge" id="roleBadge">Nakes</div>
        <div class="top-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-chat"/></svg></div>
        <div class="top-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#ic-bell"/></svg><span class="dot"></span></div>
        <div class="avatar-round" id="topAvatar"><img id="topAvatarImg" src="" alt="Akun"></div>
      </div>
    </div>

    <!-- Page fragment (pages/<key>.html) is injected here by js/nav.js:goPage() -->
    <div class="content">
      <div id="pageContent"></div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
